plugins {
    id 'com.android.application'
}

def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystores/keystore.properties')
def hasReleaseKey = keystorePropsFile.exists()
if (hasReleaseKey) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.like.novelreader'
    compileSdk 34

    defaultConfig {
        applicationId "com.like.novelreader"
        minSdk 24
        targetSdk 34
        versionCode 14
        versionName "1.13"
    }

    signingConfigs {
        release {
            if (hasReleaseKey) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseKey) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.9.0'
    // 锁屏/通知栏媒体卡片（NotificationCompat.MediaStyle + MediaSessionCompat）
    implementation 'androidx.media:media:1.7.0'
}
